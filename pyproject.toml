[project]
name = "gen-video"
version = "0.1.0"
description = "短剧生成工作流 - 基于LangGraph的视频生成系统"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "python-docx>=1.1.0",
    "pyyaml>=6.0",
    "jinja2>=3.1.0",
    "httpx>=0.27.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "volcengine-python-sdk[ark]>=5.0.42",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]
